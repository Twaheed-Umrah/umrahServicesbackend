# ==============================================================================
# Nginx Configuration for umrahdesk.masarumrah.com on AWS EC2
# Place in /etc/nginx/sites-available/umrahdesk and symlink to sites-enabled
# ==============================================================================

server {
    listen 80;
    server_name umrahdesk.masarumrah.com;

    # Maximum upload size for traveler passport scans and high-res posters
    client_max_body_size 50M;

    # Static assets served directly by Nginx with high cache performance
    location /static/ {
        alias /home/ubuntu/umrahServicesbackend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploaded media (passports, pilgrim photos, logos) served directly from EC2 filesystem
    location /media/ {
        alias /home/ubuntu/umrahServicesbackend/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Reverse proxy to Gunicorn WSGI server running on 127.0.0.1:8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
